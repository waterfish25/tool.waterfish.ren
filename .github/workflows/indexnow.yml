name: IndexNow

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Submit updates to Bing
        run: python3 .github/scripts/indexnow.py

<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8fc"><title>哈希计算 · 水鱼之家工具</title><meta name="description" content="在线计算文本 SHA-1、SHA-256、SHA-384、SHA-512 哈希值，浏览器本地处理。"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/style.css"></head><body data-tool="dev.hash"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="main-inner"><header class="head"><h1>哈希计算</h1><p>计算文本的 SHA 摘要，支持 SHA-1、SHA-256、SHA-384 与 SHA-512。</p></header><section class="tool"><div class="panel"><textarea id="hashText" placeholder="输入需要计算哈希的文本" spellcheck="false"></textarea><div class="opts"><label class="field"><span>算法</span><select id="hashAlg"><option value="SHA-256" selected>SHA-256</option><option value="SHA-1">SHA-1</option><option value="SHA-384">SHA-384</option><option value="SHA-512">SHA-512</option></select></label><div class="chip"><input id="hashUpper" type="checkbox"><span>大写输出</span></div><button type="button" class="btn primary" id="hashRun">计算</button><button type="button" class="btn ghost" data-copy="#hashOut">复制</button></div><div class="output-box" id="hashOut" hidden></div></div></section><div class="foot"><span>© 2026 waterfish.ren · 工具</span><a href="https://waterfish.ren">水鱼之家</a></div></div></main><div class="toast" id="toast"></div><script src="/assets/common.js"></script><script>(function(){var WF=window.WF;var $=WF.$;$('#hashRun').addEventListener('click',async function(){var text=$('#hashText').value;if(!text){WF.toast('请输入文本');return}var btn=this;btn.disabled=true;btn.textContent='计算中…';try{var alg=$('#hashAlg').value;var buf=await crypto.subtle.digest(alg,new TextEncoder().encode(text));var bytes=new Uint8Array(buf);var hex='';for(var i=0;i<bytes.length;i++)hex+=bytes[i].toString(16).padStart(2,'0');if($('#hashUpper').checked)hex=hex.toUpperCase();$('#hashOut').textContent=hex;$('#hashOut').hidden=false;WF.toast(alg+' 计算完成');}catch(err){WF.toast('计算失败：'+err.message);}finally{btn.disabled=false;btn.textContent='计算';}});})();</script></body></html>

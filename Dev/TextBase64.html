<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8fc"><title>Base64 编解码 · 水鱼之家工具</title><meta name="description" content="在线文本 Base64 编码与解码，完整支持中文与 Emoji，浏览器本地处理。"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/style.css"></head><body data-tool="dev.textbase64"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="main-inner"><header class="head"><h1>Base64 编解码</h1><p>文本与 Base64 互转，完整支持中文、Emoji 与多字节字符。</p></header><section class="tool"><div class="panel"><textarea id="tbText" placeholder="输入需要编码的文本，或粘贴 Base64 内容" spellcheck="false"></textarea><div class="actions"><button type="button" class="btn primary" id="tbEncode">编码</button><button type="button" class="btn" id="tbDecode">解码</button><button type="button" class="btn ghost" data-copy="#tbText">复制</button></div><div class="hint" id="tbHint"></div></div></section><div class="foot"><span>© 2026 waterfish.ren · 工具</span><a href="https://waterfish.ren">水鱼之家</a></div></div></main><div class="toast" id="toast"></div><script src="/assets/common.js"></script><script>(function(){var WF=window.WF;var $=WF.$;function encodeBytes(str){var bytes=new TextEncoder().encode(str);var bin='';for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin);}function decodeBytes(b64){var bin=atob(b64.replace(/\s+/g,''));var bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes);}$('#tbEncode').addEventListener('click',function(){var text=$('#tbText').value;if(!text){WF.toast('请输入文本');return}$('#tbText').value=encodeBytes(text);$('#tbHint').textContent='';WF.toast('编码完成');});$('#tbDecode').addEventListener('click',function(){var text=$('#tbText').value.trim();if(!text){WF.toast('请输入 Base64 内容');return}try{$('#tbText').value=decodeBytes(text);$('#tbHint').textContent='';WF.toast('解码完成');}catch(err){$('#tbHint').className='hint err';$('#tbHint').textContent='Base64 格式无效，请检查输入内容';}});})();</script></body></html>

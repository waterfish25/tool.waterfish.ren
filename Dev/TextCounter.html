<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8fc"><title>文本统计 · 水鱼之家工具</title><meta name="description" content="实时统计文本字符数、汉字数、英文单词数、行数与 UTF-8 字节数。"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/style.css"></head><body data-tool="dev.textcount"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="main-inner"><header class="head"><h1>文本统计</h1><p>输入或粘贴文本，实时统计字符、汉字、英文单词、行数与字节数。</p></header><section class="tool"><div class="panel"><textarea id="tcText" placeholder="输入或粘贴文本" spellcheck="false"></textarea><div class="actions"><button type="button" class="btn ghost" id="tcClear">清空</button></div><div class="kv"><span>字符数</span><b id="tcChars">0</b></div><div class="kv"><span>不含空格与换行</span><b id="tcNoSpace">0</b></div><div class="kv"><span>汉字数</span><b id="tcCjk">0</b></div><div class="kv"><span>英文单词数</span><b id="tcWords">0</b></div><div class="kv"><span>行数</span><b id="tcLines">0</b></div><div class="kv"><span>UTF-8 字节数</span><b id="tcBytes">0</b></div></div></section><div class="foot"><span>© 2026 waterfish.ren · 工具</span><a href="https://waterfish.ren">水鱼之家</a></div></div></main><div class="toast" id="toast"></div><script src="/assets/common.js"></script><script>(function(){var WF=window.WF;var $=WF.$;var encoder=new TextEncoder();function update(){var text=$('#tcText').value;$('#tcChars').textContent=Array.from(text).length;$('#tcNoSpace').textContent=Array.from(text.replace(/\s/g,'')).length;$('#tcCjk').textContent=(text.match(/[\u4e00-\u9fa5]/g)||[]).length;$('#tcWords').textContent=(text.match(/[A-Za-z0-9]+/g)||[]).length;$('#tcLines').textContent=text?text.split('\n').length:0;$('#tcBytes').textContent=encoder.encode(text).length;}$('#tcText').addEventListener('input',update);$('#tcClear').addEventListener('click',function(){$('#tcText').value='';update();});update();})();</script></body></html>

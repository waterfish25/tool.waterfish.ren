<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8fc"><title>颜色转换 · 水鱼之家工具</title><meta name="description" content="HEX、RGB、HSL 在线颜色格式转换工具，支持实时颜色预览与取色器。"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/style.css"></head><body data-tool="dev.color"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="main-inner"><header class="head"><span class="kicker"><i></i>开发工具</span><h1>颜色转换</h1><p>HEX、RGB、HSL 之间快速转换，支持实时预览颜色。</p></header><section class="tool"><div class="panel"><div class="swatch" id="colorSwatch"></div><div class="split"><div><label class="field"><span>HEX</span><input id="colorHex" type="text" value="#2DD4BF" spellcheck="false"></label><label class="field" style="margin-top:12px"><span>取色器</span><input id="colorPick" type="color" value="#2dd4bf" style="height:42px;padding:4px;cursor:pointer"></label></div><div><div class="kv"><span>RGB</span><b id="colorRgb">-</b></div><div class="kv"><span>HSL</span><b id="colorHsl">-</b></div></div></div><div class="actions"><button type="button" class="btn primary" id="colorRun">转换</button><button type="button" class="btn" data-copy="#colorRgb">复制 RGB</button><button type="button" class="btn" data-copy="#colorHsl">复制 HSL</button></div><div class="hint" id="colorHint">支持 #2DD4BF、#2df、rgb(45,212,191) 等写法</div></div></section><div class="foot"><span>© 2026 waterfish.ren · 工具</span><a href="/">全部工具</a><a href="https://waterfish.ren">水鱼之家</a></div></div></main><div class="toast" id="toast"></div><script src="/assets/common.js"></script><script>(function(){var WF=window.WF;var $=WF.$;function hexToRgb(input){var h=String(input).trim();var m=h.match(/^rgb\s*\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)$/i);if(m){var vals=[parseInt(m[1],10),parseInt(m[2],10),parseInt(m[3],10)];if(vals.some(function(v){return v<0||v>255}))return null;return {r:vals[0],g:vals[1],b:vals[2]};}h=h.replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c}).join('');if(!/^[0-9a-f]{6}$/i.test(h))return null;return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};}function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;var max=Math.max(r,g,b);var min=Math.min(r,g,b);var h=0;var s=0;var l=(max+min)/2;if(max!==min){var d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);if(max===r)h=(g-b)/d+(g<b?6:0);else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6;}return {h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};}function updateColor(){var rgb=hexToRgb($('#colorHex').value);if(!rgb){$('#colorHint').className='hint err';$('#colorHint').textContent='无法识别的颜色格式，请使用 HEX 或 rgb() 写法';return;}var hex='#'+[rgb.r,rgb.g,rgb.b].map(function(v){return ('0'+v.toString(16)).slice(-2)}).join('').toUpperCase();var hsl=rgbToHsl(rgb.r,rgb.g,rgb.b);$('#colorSwatch').style.background=hex;$('#colorRgb').textContent='rgb('+rgb.r+', '+rgb.g+', '+rgb.b+')';$('#colorHsl').textContent='hsl('+hsl.h+', '+hsl.s+'%, '+hsl.l+'%)';$('#colorPick').value=hex.toLowerCase();$('#colorHint').className='hint';$('#colorHint').textContent='HEX 大写写法：'+hex;}$('#colorRun').addEventListener('click',updateColor);$('#colorHex').addEventListener('keydown',function(e){if(e.key==='Enter')updateColor();});$('#colorPick').addEventListener('input',function(e){$('#colorHex').value=e.target.value.toUpperCase();updateColor();});updateColor();})();</script></body></html>

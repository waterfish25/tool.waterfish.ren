<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8fc"><title>URL 编解码 · 水鱼之家工具</title><meta name="description" content="在线 URL 编码与解码工具，正确处理中文、空格与特殊字符，方便接口调试。"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/style.css"></head><body data-tool="dev.url"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="main-inner"><header class="head"><span class="kicker"><i></i>开发工具</span><h1>URL 编解码</h1><p>对文本进行 URL 编码与解码，正确处理中文与特殊字符。</p></header><section class="tool"><div class="panel"><textarea id="urlText" placeholder="输入需要编码或解码的文本" spellcheck="false"></textarea><div class="actions"><button type="button" class="btn primary" id="urlEncode">编码</button><button type="button" class="btn" id="urlDecode">解码</button><button type="button" class="btn ghost" data-copy="#urlText">复制</button></div><div class="hint" id="urlHint">使用 encodeURIComponent / decodeURIComponent 处理文本</div></div></section><div class="foot"><span>© 2026 waterfish.ren · 工具</span><a href="/">全部工具</a><a href="https://waterfish.ren">水鱼之家</a></div></div></main><div class="toast" id="toast"></div><script src="/assets/common.js"></script><script>(function(){var WF=window.WF;var $=WF.$;$('#urlEncode').addEventListener('click',function(){var text=$('#urlText').value;if(!text){WF.toast('请输入文本');return}$('#urlText').value=encodeURIComponent(text);$('#urlHint').textContent='已编码，可直接复制使用';});$('#urlDecode').addEventListener('click',function(){var text=$('#urlText').value;if(!text){WF.toast('请输入文本');return}try{$('#urlText').value=decodeURIComponent(text);$('#urlHint').textContent='解码成功';}catch(err){WF.toast('解码失败：不是合法的 URL 编码');}});})();</script></body></html>

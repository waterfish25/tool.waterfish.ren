<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8fc"><title>UUID 生成 · 水鱼之家工具</title><meta name="description" content="在线批量生成 UUID v4，可切换大小写，浏览器本地生成。"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/style.css"></head><body data-tool="dev.uuid"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="main-inner"><header class="head"><h1>UUID 生成</h1><p>批量生成 UUID v4，使用浏览器加密随机数，本地生成不联网。</p></header><section class="tool"><div class="panel"><div class="opts"><label class="field"><span>生成数量</span><input id="uuidCount" type="number" min="1" max="50" value="5"></label><div class="chip"><input id="uuidUpper" type="checkbox"><span>大写输出</span></div><button type="button" class="btn primary" id="uuidRun">生成</button><button type="button" class="btn ghost" data-copy="#uuidOut">复制</button></div><div class="output-box" id="uuidOut" hidden></div></div></section><div class="foot"><span>© 2026 waterfish.ren · 工具</span><a href="https://waterfish.ren">水鱼之家</a></div></div></main><div class="toast" id="toast"></div><script src="/assets/common.js"></script><script>(function(){var WF=window.WF;var $=WF.$;function uuid(){if(crypto.randomUUID)return crypto.randomUUID();var bytes=crypto.getRandomValues(new Uint8Array(16));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;var hex=Array.prototype.map.call(bytes,function(b){return b.toString(16).padStart(2,'0')}).join('');return hex.slice(0,8)+'-'+hex.slice(8,12)+'-'+hex.slice(12,16)+'-'+hex.slice(16,20)+'-'+hex.slice(20);}$('#uuidRun').addEventListener('click',function(){var count=parseInt($('#uuidCount').value,10);if(!count||count<1||count>50){WF.toast('数量需在 1 到 50 之间');return;}var list=[];for(var i=0;i<count;i++)list.push(uuid());var text=list.join('\n');if($('#uuidUpper').checked)text=text.toUpperCase();$('#uuidOut').textContent=text;$('#uuidOut').hidden=false;WF.toast('已生成 '+count+' 个 UUID');});})();</script></body></html>

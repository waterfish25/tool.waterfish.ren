<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8fc"><title>时间戳转换 · 水鱼之家工具</title><meta name="description" content="Unix 时间戳与北京时间、UTC、ISO 8601 在线双向转换，支持秒与毫秒自动识别。"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/style.css"></head><body data-tool="dev.time"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="main-inner"><header class="head"><span class="kicker"><i></i>开发工具</span><h1>时间戳转换</h1><p>Unix 时间戳与北京时间、UTC、ISO 8601 双向转换，自动识别秒与毫秒。</p></header><section class="tool"><div class="panel"><div class="split"><div><label class="field"><span>时间戳（秒或毫秒，自动识别）</span><input id="tsInput" type="text" placeholder="1762300000" inputmode="numeric"></label><div class="actions"><button type="button" class="btn primary" id="tsRun">转换为时间</button><button type="button" class="btn" id="tsNow">填入当前</button><button type="button" class="btn ghost" data-copy="#tsInput">复制</button></div><div class="kv"><span>北京时间</span><b id="tsLocal">-</b></div><div class="kv"><span>UTC</span><b id="tsUtc">-</b></div><div class="kv"><span>ISO 8601</span><b id="tsIso">-</b></div><div class="kv"><span>相对现在</span><b id="tsRel">-</b></div></div><div><label class="field"><span>日期时间转时间戳</span><input id="dtInput" type="datetime-local"></label><div class="actions"><button type="button" class="btn primary" id="dtRun">转换时间戳</button><button type="button" class="btn" id="dtNow">填入当前</button></div><div class="kv"><span>秒</span><b id="dtSec">-</b></div><div class="kv"><span>毫秒</span><b id="dtMs">-</b></div></div></div></div></section><div class="foot"><span>© 2026 waterfish.ren · 工具</span><a href="/">全部工具</a><a href="https://waterfish.ren">水鱼之家</a></div></div></main><div class="toast" id="toast"></div><script src="/assets/common.js"></script><script>(function(){var WF=window.WF;var $=function(id){return document.getElementById(id)};function pad(n){return n<10?'0'+n:String(n);}function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}function fmtDateUtc(d){return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())+' '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+':'+pad(d.getUTCSeconds())+' UTC';}function relativeText(ms){var diff=ms-Date.now();var abs=Math.abs(diff);var units=[['天',86400000],['小时',3600000],['分钟',60000],['秒',1000]];var label='';var val=0;for(var i=0;i<units.length;i++){if(abs>=units[i][1]){val=Math.floor(abs/units[i][1]);label=units[i][0];break;}}if(!label)return '刚刚';return diff>=0?'距现在还有 '+val+' '+label:'已是 '+val+' '+label+'前';}$('tsRun').addEventListener('click',function(){var raw=$('tsInput').value.trim();if(!raw){WF.toast('请输入时间戳');return}var num=Number(raw);if(!isFinite(num)){WF.toast('时间戳格式不正确');return}var ms=Math.abs(num)>=1e12?num:num*1000;var d=new Date(ms);if(isNaN(d.getTime())){WF.toast('时间戳超出范围');return}$('tsLocal').textContent=fmtDate(d);$('tsUtc').textContent=fmtDateUtc(d);$('tsIso').textContent=d.toISOString();$('tsRel').textContent=relativeText(ms);});$('tsNow').addEventListener('click',function(){$('tsInput').value=String(Math.floor(Date.now()/1000));$('tsRun').click();});$('dtNow').addEventListener('click',function(){var d=new Date();var v=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());$('dtInput').value=v;$('dtRun').click();});$('dtRun').addEventListener('click',function(){var v=$('dtInput').value;if(!v){WF.toast('请选择日期时间');return}var d=new Date(v);if(isNaN(d.getTime())){WF.toast('日期格式不正确');return}$('dtSec').textContent=String(Math.floor(d.getTime()/1000));$('dtMs').textContent=String(d.getTime());});})();</script></body></html>

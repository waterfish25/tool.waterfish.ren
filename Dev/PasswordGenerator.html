<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8fc"><title>密码生成 · 水鱼之家工具</title><meta name="description" content="在线随机密码生成器，支持自定义长度与字符集，使用浏览器加密随机数，本地生成不上传。"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/style.css"></head><body data-tool="dev.password"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="main-inner"><header class="head"><h1>密码生成</h1><p>自定义长度与字符集，在本地生成高强度随机密码。</p></header><section class="tool"><div class="panel"><label class="field"><span>密码长度 <b id="pwLenVal">20</b></span><input id="pwLen" type="range" min="6" max="64" value="20"></label><div class="chip-row"><label class="chip"><input id="pwUpper" type="checkbox" checked>大写字母</label><label class="chip"><input id="pwLower" type="checkbox" checked>小写字母</label><label class="chip"><input id="pwDigit" type="checkbox" checked>数字</label><label class="chip"><input id="pwSymbol" type="checkbox" checked>符号</label><label class="chip"><input id="pwPlain" type="checkbox">排除易混淆字符</label></div><div class="copy-row"><input id="pwOut" type="text" readonly placeholder="点击生成密码"><button type="button" class="btn primary" id="pwRun">生成</button><button type="button" class="btn" data-copy="#pwOut">复制</button></div></div></section><div class="foot"><span>© 2026 waterfish.ren · 工具</span><a href="https://waterfish.ren">水鱼之家</a></div></div></main><div class="toast" id="toast"></div><script src="/assets/common.js"></script><script>(function(){var WF=window.WF;var $=WF.$;function randomInt(max){var arr=new Uint32Array(1);crypto.getRandomValues(arr);return arr[0]%max;}function shuffle(str){var arr=str.split('');for(var i=arr.length-1;i>0;i--){var j=randomInt(i+1);var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;}return arr.join('');}var sets={upper:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',lower:'abcdefghijklmnopqrstuvwxyz',digit:'0123456789',symbol:'!@#$%^&*()-_=+[]{};:,.?/'};var ambiguous='O0oIl1|`\'"';$('#pwLen').addEventListener('input',function(e){$('#pwLenVal').textContent=e.target.value;});$('#pwRun').addEventListener('click',function(){var len=parseInt($('#pwLen').value,10);var selected=[];if($('#pwUpper').checked)selected.push(sets.upper);if($('#pwLower').checked)selected.push(sets.lower);if($('#pwDigit').checked)selected.push(sets.digit);if($('#pwSymbol').checked)selected.push(sets.symbol);if(!selected.length){WF.toast('请至少选择一种字符类型');return}if($('#pwPlain').checked){selected=selected.map(function(set){return set.split('').filter(function(ch){return ambiguous.indexOf(ch)<0}).join('');});}var all=selected.join('');if(!all){WF.toast('字符集为空，请调整选项');return}var chars=[];selected.forEach(function(set){chars.push(set[randomInt(set.length)])});while(chars.length<len)chars.push(all[randomInt(all.length)]);$('#pwOut').value=shuffle(chars.join(''));});$('#pwRun').click();})();</script></body></html>

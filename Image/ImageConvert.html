<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d12"><title>图片格式转换 · 水鱼之家工具</title><meta name="description" content="在线将 PNG、JPEG、WebP 等图片格式互转，支持批量处理，全部在浏览器本地完成。"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/style.css"></head><body data-tool="image.convert"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="main-inner"><header class="head"><span class="kicker"><i></i>图片工具</span><h1>图片格式转换</h1><p>PNG、JPEG、WebP 等格式互转，支持批量处理，全部在本地完成。</p></header><section class="tool"><div class="panel"><label class="drop" id="cvDrop" for="cvFile"><span class="drop-ico">+</span><b>选择或拖拽图片</b><small>支持 PNG / JPEG / WebP / GIF / BMP，可多选</small><input id="cvFile" type="file" accept="image/*" multiple hidden></label><div class="opts"><label class="field"><span>输出格式</span><select id="cvFmt"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp" selected>WebP</option></select></label><label class="field"><span>质量 <b id="cvQualityVal">85%</b></span><input id="cvQuality" type="range" min="10" max="100" value="85"></label><button type="button" class="btn primary" id="cvRun" disabled>开始转换</button></div><div class="hint" id="cvHint">尚未选择图片</div></div><div class="results" id="cvList"></div><div class="actions"><button type="button" class="btn" id="cvAll" disabled>下载全部</button><button type="button" class="btn ghost" id="cvClear">清空</button></div></section><div class="foot"><span>© 2026 waterfish.ren · 工具</span><a href="/">全部工具</a><a href="https://waterfish.ren">水鱼之家</a></div></div></main><div class="toast" id="toast"></div><script src="/assets/common.js"></script><script>(function(){var WF=window.WF;var $=WF.$;var queue=[];var items=[];var urls=[];function updateHint(){$('#cvHint').innerHTML=queue.length?'已选择 <b>'+queue.length+'</b> 张图片，等待转换':'尚未选择图片';$('#cvRun').disabled=!queue.length;}WF.setupDrop('cvDrop','cvFile',function(files){queue=queue.concat(files);updateHint();});$('#cvQuality').addEventListener('input',function(e){$('#cvQualityVal').textContent=e.target.value+'%';});$('#cvFmt').addEventListener('change',function(e){$('#cvQuality').disabled=e.target.value==='image/png';});$('#cvRun').addEventListener('click',async function(){if(!queue.length)return;var btn=this;btn.disabled=true;btn.textContent='转换中…';var fmt=$('#cvFmt').value;var quality=parseInt($('#cvQuality').value,10)/100;var out=[];try{for(var i=0;i<queue.length;i++){var file=queue[i];var img=await WF.loadImg(file);var canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;var ctx=canvas.getContext('2d');if(fmt==='image/jpeg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);}ctx.drawImage(img,0,0);var blob=await WF.toBlob(canvas,fmt,quality);if(!blob)throw new Error('当前浏览器不支持该格式');out.push({name:WF.baseName(file.name)+'.'+WF.extFor(fmt),url:URL.createObjectURL(blob),size:blob.size,before:file.size});}urls.forEach(function(u){URL.revokeObjectURL(u)});urls=out.map(function(it){return it.url});items=out;$('#cvList').innerHTML=WF.imageCards(items);$('#cvAll').disabled=false;$('#cvHint').innerHTML='转换完成，共 <b>'+items.length+'</b> 张图片';WF.toast('转换完成');}catch(err){WF.toast('转换失败：'+err.message);}finally{btn.disabled=false;btn.textContent='开始转换';}});$('#cvAll').addEventListener('click',function(){WF.downloadAll(items)});$('#cvClear').addEventListener('click',function(){queue=[];items=[];urls.forEach(function(u){URL.revokeObjectURL(u)});urls=[];$('#cvList').innerHTML='';$('#cvAll').disabled=true;updateHint();});})();</script></body></html>

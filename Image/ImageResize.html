<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8fc"><title>图片尺寸调整 · 水鱼之家工具</title><meta name="description" content="在线调整图片尺寸，按指定宽高缩放，可锁定宽高比，支持 PNG、JPEG、WebP 导出。"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/style.css"></head><body data-tool="image.resize"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="main-inner"><header class="head"><h1>图片尺寸调整</h1><p>按指定宽高缩放图片，可锁定宽高比并导出为常用格式。</p></header><section class="tool"><div class="panel"><label class="drop" id="rsDrop" for="rsFile"><span class="drop-ico">+</span><b>选择或拖拽图片</b><small>填写宽度或高度即可等比缩放，支持批量</small><input id="rsFile" type="file" accept="image/*" multiple hidden></label><div class="opts"><label class="field"><span>宽度（px）</span><input id="rsW" type="number" min="1" max="12000" placeholder="自动"></label><label class="field"><span>高度（px）</span><input id="rsH" type="number" min="1" max="12000" placeholder="自动"></label><label class="field"><span>输出格式</span><select id="rsFmt"><option value="image/png" selected>PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select></label><label class="chip"><input id="rsLock" type="checkbox" checked>锁定比例</label><button type="button" class="btn primary" id="rsRun" disabled>开始调整</button></div><div class="hint" id="rsHint">尚未选择图片</div></div><div class="results" id="rsList"></div><div class="actions"><button type="button" class="btn" id="rsAll" disabled>下载全部</button><button type="button" class="btn ghost" id="rsClear">清空</button></div></section><div class="foot"><span>© 2026 waterfish.ren · 工具</span><a href="https://waterfish.ren">水鱼之家</a></div></div></main><div class="toast" id="toast"></div><script src="/assets/common.js"></script><script>(function(){var WF=window.WF;var $=WF.$;var files=[];var items=[];var urls=[];var ratio=0;function updateHint(){$('#rsHint').innerHTML=files.length?'已选择 <b>'+files.length+'</b> 张图片':'尚未选择图片';$('#rsRun').disabled=!files.length;}WF.setupDrop('rsDrop','rsFile',async function(list){files=files.concat(list);updateHint();try{var img=await WF.loadImg(files[0]);ratio=img.naturalWidth/img.naturalHeight;if(!$('#rsW').value)$('#rsW').value=img.naturalWidth;if(!$('#rsH').value)$('#rsH').value=img.naturalHeight;}catch(err){}});$('#rsW').addEventListener('input',function(){if(!$('#rsLock').checked||!ratio)return;var w=parseInt(this.value,10);if(w>0)$('#rsH').value=Math.round(w/ratio);});$('#rsH').addEventListener('input',function(){if(!$('#rsLock').checked||!ratio)return;var h=parseInt(this.value,10);if(h>0)$('#rsW').value=Math.round(h*ratio);});$('#rsRun').addEventListener('click',async function(){if(!files.length)return;var w=parseInt($('#rsW').value,10);var h=parseInt($('#rsH').value,10);var btn=this;if(!w&&!h){WF.toast('请填写目标宽度或高度');return}var sample=await WF.loadImg(files[0]);if(!w)w=Math.round(h*(sample.naturalWidth/sample.naturalHeight));if(!h)h=Math.round(w*(sample.naturalHeight/sample.naturalWidth));btn.disabled=true;btn.textContent='处理中…';var fmt=$('#rsFmt').value;var quality=0.92;var out=[];try{for(var i=0;i<files.length;i++){var file=files[i];var img=await WF.loadImg(file);var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;var ctx=canvas.getContext('2d');if(fmt==='image/jpeg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);}ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,w,h);var blob=await WF.toBlob(canvas,fmt,quality);if(!blob)throw new Error('当前浏览器不支持该格式');out.push({name:WF.baseName(file.name)+'-'+w+'x'+h+'.'+WF.extFor(fmt),url:URL.createObjectURL(blob),size:blob.size,before:file.size,dims:w+'×'+h});}urls.forEach(function(u){URL.revokeObjectURL(u)});urls=out.map(function(it){return it.url});items=out;$('#rsList').innerHTML=WF.imageCards(items);$('#rsAll').disabled=false;$('#rsHint').innerHTML='调整完成，尺寸 <b>'+w+'×'+h+'</b>';WF.toast('尺寸调整完成');}catch(err){WF.toast('处理失败：'+err.message);}finally{btn.disabled=false;btn.textContent='开始调整';}});$('#rsAll').addEventListener('click',function(){WF.downloadAll(items)});$('#rsClear').addEventListener('click',function(){files=[];items=[];urls.forEach(function(u){URL.revokeObjectURL(u)});urls=[];ratio=0;$('#rsList').innerHTML='';$('#rsW').value='';$('#rsH').value='';$('#rsAll').disabled=true;updateHint();});})();</script></body></html>

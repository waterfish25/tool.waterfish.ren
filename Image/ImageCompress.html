<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d12"><title>图片压缩 · 水鱼之家工具</title><meta name="description" content="在线压缩图片体积，支持 WebP、JPEG、PNG 输出，可调整压缩质量，全部本地处理。"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/style.css"></head><body data-tool="image.compress"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="main-inner"><header class="head"><span class="kicker"><i></i>图片工具</span><h1>图片压缩</h1><p>调整质量重新编码，快速减小图片体积，输出 WebP 或 JPEG，支持批量处理。</p></header><section class="tool"><div class="panel"><label class="drop" id="cpDrop" for="cpFile"><span class="drop-ico">+</span><b>选择或拖拽图片</b><small>适合照片与截图，重新编码以减小体积</small><input id="cpFile" type="file" accept="image/*" multiple hidden></label><div class="opts"><label class="field"><span>输出格式</span><select id="cpFmt"><option value="image/webp" selected>WebP（推荐）</option><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option></select></label><label class="field"><span>质量 <b id="cpQualityVal">75%</b></span><input id="cpQuality" type="range" min="10" max="100" value="75"></label><button type="button" class="btn primary" id="cpRun" disabled>开始压缩</button></div><div class="hint" id="cpHint">尚未选择图片</div></div><div class="results" id="cpList"></div><div class="actions"><button type="button" class="btn" id="cpAll" disabled>下载全部</button><button type="button" class="btn ghost" id="cpClear">清空</button></div></section><div class="foot"><span>© 2026 waterfish.ren · 工具</span><a href="/">全部工具</a><a href="https://waterfish.ren">水鱼之家</a></div></div></main><div class="toast" id="toast"></div><script src="/assets/common.js"></script><script>(function(){var WF=window.WF;var $=WF.$;var queue=[];var items=[];var urls=[];function updateHint(){$('#cpHint').innerHTML=queue.length?'已选择 <b>'+queue.length+'</b> 张图片，等待压缩':'尚未选择图片';$('#cpRun').disabled=!queue.length;}WF.setupDrop('cpDrop','cpFile',function(files){queue=queue.concat(files);updateHint();});$('#cpQuality').addEventListener('input',function(e){$('#cpQualityVal').textContent=e.target.value+'%';});$('#cpRun').addEventListener('click',async function(){if(!queue.length)return;var btn=this;btn.disabled=true;btn.textContent='压缩中…';var fmt=$('#cpFmt').value;var quality=parseInt($('#cpQuality').value,10)/100;var out=[];try{for(var i=0;i<queue.length;i++){var file=queue[i];var img=await WF.loadImg(file);var canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;var ctx=canvas.getContext('2d');if(fmt==='image/jpeg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);}ctx.drawImage(img,0,0);var blob=await WF.toBlob(canvas,fmt,quality);if(!blob)throw new Error('当前浏览器不支持该格式');out.push({name:WF.baseName(file.name)+'.'+WF.extFor(fmt),url:URL.createObjectURL(blob),size:blob.size,before:file.size});}urls.forEach(function(u){URL.revokeObjectURL(u)});urls=out.map(function(it){return it.url});items=out;$('#cpList').innerHTML=WF.imageCards(items);$('#cpAll').disabled=false;$('#cpHint').innerHTML='压缩完成，共 <b>'+items.length+'</b> 张图片';WF.toast('压缩完成');}catch(err){WF.toast('压缩失败：'+err.message);}finally{btn.disabled=false;btn.textContent='开始压缩';}});$('#cpAll').addEventListener('click',function(){WF.downloadAll(items)});$('#cpClear').addEventListener('click',function(){queue=[];items=[];urls.forEach(function(u){URL.revokeObjectURL(u)});urls=[];$('#cpList').innerHTML='';$('#cpAll').disabled=true;updateHint();});})();</script></body></html>

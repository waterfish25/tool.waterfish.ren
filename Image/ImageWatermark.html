<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8fc"><title>图片水印 · 水鱼之家工具</title><meta name="description" content="在线批量给图片添加文字水印，可调整位置、字号、颜色与透明度，浏览器本地处理。"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/style.css"></head><body data-tool="image.watermark"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="main-inner"><header class="head"><h1>图片水印</h1><p>批量添加文字水印，可设置位置、字号、颜色与透明度，输出 PNG 图片。</p></header><section class="tool"><div class="panel"><label class="drop" id="wmDrop" for="wmFile"><span class="drop-ico">+</span><b>点击或拖拽图片到这里</b><small>支持 PNG、JPEG、WebP，可多选</small><input id="wmFile" type="file" accept="image/*" multiple hidden></label><div class="opts"><label class="field"><span>水印文字</span><input id="wmText" type="text" value="水鱼之家" placeholder="输入水印文字"></label><label class="field"><span>位置</span><select id="wmPos"><option value="br" selected>右下角</option><option value="bl">左下角</option><option value="tr">右上角</option><option value="tl">左上角</option><option value="center">居中</option></select></label><label class="field"><span>字号 <b id="wmSizeVal">32</b> px</span><input id="wmSize" type="range" min="12" max="96" value="32"></label><label class="field"><span>透明度 <b id="wmOpacityVal">80</b>%</span><input id="wmOpacity" type="range" min="10" max="100" value="80"></label><label class="field"><span>颜色</span><input id="wmColor" type="color" value="#ffffff"></label><button type="button" class="btn primary" id="wmRun" disabled>开始处理</button></div><div class="hint" id="wmHint">尚未选择图片</div></div><div class="results" id="wmList"></div><div class="actions"><button type="button" class="btn" id="wmAll" disabled>下载全部</button><button type="button" class="btn ghost" id="wmClear">清空</button></div></section><div class="foot"><span>© 2026 waterfish.ren · 工具</span><a href="https://waterfish.ren">水鱼之家</a></div></div></main><div class="toast" id="toast"></div><script src="/assets/common.js"></script><script>(function(){var WF=window.WF;var $=WF.$;var files=[];var items=[];var urls=[];function refresh(){$('#wmHint').innerHTML=files.length?'已选择 <b>'+files.length+'</b> 张图片':'尚未选择图片';$('#wmRun').disabled=!files.length;}WF.setupDrop('wmDrop','wmFile',function(list){files=files.concat(list);refresh();});$('#wmSize').addEventListener('input',function(){$('#wmSizeVal').textContent=this.value});$('#wmOpacity').addEventListener('input',function(){$('#wmOpacityVal').textContent=this.value});$('#wmRun').addEventListener('click',async function(){if(!files.length)return;var text=$('#wmText').value.trim();if(!text){WF.toast('请输入水印文字');return;}var btn=this;btn.disabled=true;btn.textContent='处理中…';var pos=$('#wmPos').value;var size=parseInt($('#wmSize').value,10);var opacity=parseInt($('#wmOpacity').value,10);var color=$('#wmColor').value;var out=[];try{for(var i=0;i<files.length;i++){var file=files[i];var img=await WF.loadImg(file);var canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0);ctx.font='600 '+size+'px "PingFang SC","Microsoft YaHei",sans-serif';var tw=ctx.measureText(text).width;var pad=Math.max(12,Math.round(size/2));var x=pad;var y=pad;if(pos==='br'){x=canvas.width-pad-tw;y=canvas.height-pad-size}if(pos==='bl'){y=canvas.height-pad-size}if(pos==='tr'){x=canvas.width-pad-tw}if(pos==='center'){x=(canvas.width-tw)/2;y=(canvas.height-size)/2}ctx.globalAlpha=opacity/100;ctx.fillStyle=color;ctx.shadowColor='rgba(0,0,0,0.35)';ctx.shadowBlur=Math.max(2,Math.round(size/6));ctx.textBaseline='top';ctx.fillText(text,x,y);var blob=await WF.toBlob(canvas,'image/png');out.push({name:WF.baseName(file.name)+'-watermark.png',url:URL.createObjectURL(blob),size:blob.size,before:file.size,dims:canvas.width+'×'+canvas.height});}urls.forEach(function(u){URL.revokeObjectURL(u)});urls=out.map(function(it){return it.url});items=out;$('#wmList').innerHTML=WF.imageCards(items);$('#wmAll').disabled=false;$('#wmHint').innerHTML='处理完成，共 <b>'+items.length+'</b> 张图片';WF.toast('处理完成');}catch(err){WF.toast('处理失败：'+err.message);}finally{btn.disabled=false;btn.textContent='开始处理';}});$('#wmAll').addEventListener('click',function(){WF.downloadAll(items)});$('#wmClear').addEventListener('click',function(){files=[];items=[];urls.forEach(function(u){URL.revokeObjectURL(u)});urls=[];$('#wmList').innerHTML='';$('#wmAll').disabled=true;refresh();});})();</script></body></html>

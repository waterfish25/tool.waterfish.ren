<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8fc"><title>图片 Base64 · 水鱼之家工具</title><meta name="description" content="图片与 Base64 编码在线互转，支持 Data URI，方便嵌入 HTML、CSS 或接口调试。"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/style.css"></head><body data-tool="image.base64"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="main-inner"><header class="head"><span class="kicker"><i></i>图片工具</span><h1>图片 Base64</h1><p>图片与 Base64 编码互转，方便嵌入 HTML、CSS 或进行接口调试。</p></header><section class="tool"><div class="panel"><label class="drop" id="b64Drop" for="b64File"><span class="drop-ico">+</span><b>选择图片转为 Base64</b><small>支持拖拽单张图片，自动生成 Data URI</small><input id="b64File" type="file" accept="image/*" hidden></label><textarea id="b64Text" placeholder="粘贴 Base64 或 data:image/...;base64, 字符串" spellcheck="false"></textarea><div class="actions"><button type="button" class="btn primary" id="b64Decode">Base64 转图片</button><button type="button" class="btn" data-copy="#b64Text">复制文本</button><a class="btn ghost" id="b64Download" download="decoded.png" hidden>下载图片</a></div><div class="hint" id="b64Hint">图片 → Base64 会自动填充上方文本框</div></div><div class="results"><div class="card"><div class="thumb"><img id="b64Img" alt="" hidden></div></div></div></section><div class="foot"><span>© 2026 waterfish.ren · 工具</span><a href="/">全部工具</a><a href="https://waterfish.ren">水鱼之家</a></div></div></main><div class="toast" id="toast"></div><script src="/assets/common.js"></script><script>(function(){var WF=window.WF;var $=WF.$;var name='decoded.png';function sniffMime(b64){if(b64.indexOf('/9j/')===0)return 'image/jpeg';if(b64.indexOf('iVBORw0KGgo')===0)return 'image/png';if(b64.indexOf('R0lGOD')===0)return 'image/gif';if(b64.indexOf('UklGR')===0)return 'image/webp';if(b64.indexOf('Qk')===0)return 'image/bmp';return 'image/png';}function show(dataUrl,fileName){var img=$('#b64Img');img.src=dataUrl;img.hidden=false;$('#b64Download').href=dataUrl;$('#b64Download').download=fileName;$('#b64Download').hidden=false;}WF.setupDrop('b64Drop','b64File',function(files){var file=files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){$('#b64Text').value=reader.result;name=WF.baseName(file.name)+'.'+WF.extFor(file.type);$('#b64Hint').innerHTML='已生成 Base64，原图 <b>'+WF.formatBytes(file.size)+'</b>，长度 <b>'+reader.result.length+'</b> 字符';show(reader.result,name);};reader.readAsDataURL(file);});$('#b64Decode').addEventListener('click',function(){var raw=$('#b64Text').value.trim();if(!raw){WF.toast('请先粘贴 Base64 内容');return}var mime='image/png';var dataUrl=raw;if(raw.indexOf('data:')===0){var m=raw.match(/^data:([^;,]+)[;,]/);if(m)mime=m[1];}else{mime=sniffMime(raw.replace(/\s/g,''));dataUrl='data:'+mime+';base64,'+raw.replace(/\s/g,'');}name='decoded.'+WF.extFor(mime);var probe=new Image();probe.onload=function(){show(dataUrl,name);$('#b64Hint').innerHTML='Base64 解析成功，格式 <b>'+mime+'</b>';WF.toast('解析成功');};probe.onerror=function(){WF.toast('Base64 无法解析为图片')};probe.src=dataUrl;});})();</script></body></html>

<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8fc"><title>图片旋转翻转 · 水鱼之家工具</title><meta name="description" content="在线批量旋转图片 90°、180°、270°，或水平、垂直翻转，浏览器本地处理。"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/style.css"></head><body data-tool="image.rotate"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="main-inner"><header class="head"><h1>图片旋转翻转</h1><p>旋转 90°、180°、270°，或进行水平、垂直翻转，支持批量处理与格式导出。</p></header><section class="tool"><div class="panel"><label class="drop" id="rtDrop" for="rtFile"><span class="drop-ico">+</span><b>点击或拖拽图片到这里</b><small>支持 PNG、JPEG、WebP，可多选</small><input id="rtFile" type="file" accept="image/*" multiple hidden></label><div class="opts"><label class="field"><span>旋转角度</span><select id="rtAngle"><option value="0" selected>不旋转</option><option value="90">顺时针 90°</option><option value="180">180°</option><option value="270">顺时针 270°</option></select></label><label class="field"><span>翻转方式</span><select id="rtFlip"><option value="none" selected>不翻转</option><option value="h">水平翻转</option><option value="v">垂直翻转</option></select></label><label class="field"><span>输出格式</span><select id="rtFmt"><option value="image/png" selected>PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select></label><button type="button" class="btn primary" id="rtRun" disabled>开始处理</button></div><div class="hint" id="rtHint">尚未选择图片</div></div><div class="results" id="rtList"></div><div class="actions"><button type="button" class="btn" id="rtAll" disabled>下载全部</button><button type="button" class="btn ghost" id="rtClear">清空</button></div></section><div class="foot"><span>© 2026 waterfish.ren · 工具</span><a href="https://waterfish.ren">水鱼之家</a></div></div></main><div class="toast" id="toast"></div><script src="/assets/common.js"></script><script>(function(){var WF=window.WF;var $=WF.$;var files=[];var items=[];var urls=[];function refresh(){$('#rtHint').innerHTML=files.length?'已选择 <b>'+files.length+'</b> 张图片':'尚未选择图片';$('#rtRun').disabled=!files.length;}WF.setupDrop('rtDrop','rtFile',function(list){files=files.concat(list);refresh();});$('#rtRun').addEventListener('click',async function(){if(!files.length)return;var btn=this;btn.disabled=true;btn.textContent='处理中…';var angle=parseInt($('#rtAngle').value,10);var flip=$('#rtFlip').value;var fmt=$('#rtFmt').value;var out=[];try{for(var i=0;i<files.length;i++){var file=files[i];var img=await WF.loadImg(file);var swap=angle===90||angle===270;var w=swap?img.naturalHeight:img.naturalWidth;var h=swap?img.naturalWidth:img.naturalHeight;var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;var ctx=canvas.getContext('2d');if(fmt==='image/jpeg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);}ctx.translate(w/2,h/2);ctx.rotate(angle*Math.PI/180);if(flip==='h')ctx.scale(-1,1);if(flip==='v')ctx.scale(1,-1);ctx.drawImage(img,-img.naturalWidth/2,-img.naturalHeight/2);var blob=await WF.toBlob(canvas,fmt,0.92);if(!blob)throw new Error('当前浏览器不支持该输出格式');out.push({name:WF.baseName(file.name)+'-r'+angle+(flip==='none'?'':'-'+flip)+'.'+WF.extFor(fmt),url:URL.createObjectURL(blob),size:blob.size,before:file.size,dims:w+'×'+h});}urls.forEach(function(u){URL.revokeObjectURL(u)});urls=out.map(function(it){return it.url});items=out;$('#rtList').innerHTML=WF.imageCards(items);$('#rtAll').disabled=false;$('#rtHint').innerHTML='处理完成，共 <b>'+items.length+'</b> 张图片';WF.toast('处理完成');}catch(err){WF.toast('处理失败：'+err.message);}finally{btn.disabled=false;btn.textContent='开始处理';}});$('#rtAll').addEventListener('click',function(){WF.downloadAll(items)});$('#rtClear').addEventListener('click',function(){files=[];items=[];urls.forEach(function(u){URL.revokeObjectURL(u)});urls=[];$('#rtList').innerHTML='';$('#rtAll').disabled=true;refresh();});})();</script></body></html>

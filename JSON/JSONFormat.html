<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8fc"><title>JSON 格式化 · 水鱼之家工具</title><meta name="description" content="在线 JSON 格式化、压缩与校验工具，支持 2 空格、4 空格与 Tab 缩进，自动提示语法错误。"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/style.css"></head><body data-tool="json.format"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="main-inner"><header class="head"><h1>JSON 格式化</h1><p>格式化、压缩与校验 JSON，支持 2 空格、4 空格与 Tab 缩进。</p></header><section class="tool"><div class="panel"><textarea id="jsonIn" placeholder='粘贴 JSON，例如 {"name":"waterfish","tools":9}' spellcheck="false"></textarea><div class="opts"><label class="field"><span>缩进</span><select id="jsonIndent"><option value="2" selected>2 空格</option><option value="4">4 空格</option><option value="tab">Tab</option></select></label><button type="button" class="btn primary" id="jsonFormat">格式化</button><button type="button" class="btn" id="jsonMinify">压缩</button><button type="button" class="btn ghost" data-copy="#jsonOut">复制结果</button></div><div class="output-box" id="jsonOut" hidden></div></div></section><div class="foot"><span>© 2026 waterfish.ren · 工具</span><a href="https://waterfish.ren">水鱼之家</a></div></div></main><div class="toast" id="toast"></div><script src="/assets/common.js"></script><script>(function(){var WF=window.WF;var $=document.getElementById.bind(document);var out=$('jsonOut');function show(text,isError){out.hidden=false;out.textContent=text;out.style.color=isError?'#f87171':'#d7e9f5';}$('jsonFormat').addEventListener('click',function(){var raw=$('jsonIn').value.trim();if(!raw){WF.toast('请先粘贴 JSON');return}try{var indent=$('jsonIndent').value;var space=indent==='tab'?'\t':parseInt(indent,10);var parsed=JSON.parse(raw);show(JSON.stringify(parsed,null,space),false);}catch(err){show('JSON 解析失败：'+err.message,true);}});$('jsonMinify').addEventListener('click',function(){var raw=$('jsonIn').value.trim();if(!raw){WF.toast('请先粘贴 JSON');return}try{var parsed=JSON.parse(raw);var text=JSON.stringify(parsed);show(text,false);}catch(err){show('JSON 解析失败：'+err.message,true);}});})();</script></body></html>
